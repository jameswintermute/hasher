[about]
project   = Hasher — NAS File Hasher & Duplicate Finder
version   = v1.4.32
copyright = Copyright (C) 2025 James Wintermute
license   = GNU GPLv3 (https://www.gnu.org/licenses/)

[setup]
first_run_help  = true
paths_template  = paths.example.txt

[logging]
background-interval = 15
level = info
xtrace = false
# Option: sort the output CSV by path after hashing completes. 
# Defaults to true. Sort is fail-safe, the original CSV is never modified until the sorted candidate passes row-count and header validation. Set to false to preserve worker-race order (useful only for diagnostics).
sort_output = true

[post_hash]
# automatic is the recommended time-saving workflow. Manual mode keeps duplicate discovery as an explicit launcher step.
analysis_mode = automatic
auto_find_duplicate_folders = true
auto_find_duplicate_files = true
auto_build_review_index = true

[exclusions]
inherit-defaults = true
