# hasher.conf — configuration for hasher project
# Place in default/ (ship) or local/ (override). Lines starting with # are comments.

[about]
project   = Hasher — NAS File Hasher & Duplicate Finder
version   = v1.3.26
copyright = Copyright (C) 2025 James Wintermute
license   = GNU GPLv3 (https://www.gnu.org/licenses/)

[setup]
first_run_help  = true
paths_template  = paths.example.txt

[logging]
background-interval = 15
level = info
xtrace = false
# v1.3.22: sort the output CSV by path after hashing completes. Defaults
# to true. Sort is fail-safe — the original CSV is never modified until
# the sorted candidate passes row-count and header validation. Set to
# false to preserve worker-race order (useful only for diagnostics).
sort_output = true

[exclusions]
inherit-defaults = true

# Safe-by-default quarantine target.
# Leave commented-out to let the shared resolver choose the default, which since
# v1.2.4 is install-relative on EVERY host:
#   <install-dir>/quarantine-DATE   (i.e. beside the tool)
# Set this to override (used by all quarantine-capable tools: file dedup,
# folder dedup, and zero-length removal). A literal $(date +%F) is expanded.
# QUARANTINE_DIR="/volume1/Tools/hasher/quarantine-$(date +%F)"

# v1.3.13 (recheck item 5): removed config keys that no code consumed, so the
# shipped defaults no longer promise controls that are not wired in:
#   [review] section (input/sort/skip_zero_size/min_size_mb/include_regex/
#   exclude_regex/report_dir/report_prefix_date/summary_limit_groups),
#   LOW_VALUE_THRESHOLD_BYTES, ZERO_APPLY_EXCLUDES, EXCLUDES_FILE, CRON_SPEC.
# If a feature returns, its key returns with it.
